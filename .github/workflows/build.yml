name: Test ve derleme

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,ner]"
      - run: pytest -q   # NER testleri model olmadığı için atlanır

  macos:
    needs: test
    runs-on: macos-15  # Apple Silicon, Xcode yüklü
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # derleme numarası için commit sayısı
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,ner]"
      - name: Dil modeli (önbellekten)
        uses: actions/cache@v4
        with:
          path: anonimlestirici/models/ner
          key: ner-modernbert-tr-pii-69b2563-full
      - run: ./packaging/fetch_model.sh
        if: hashFiles('anonimlestirici/models/ner/model.onnx') == ''
      - run: pytest -q tests/test_ner.py
      - name: Uygulama ve DMG (ad-hoc imza)
        run: ./packaging/build_mac.sh
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        with:
          name: Anonimlestirici-dmg
          path: dist/*.dmg
      - name: Sandbox içinde öz-test
        timeout-minutes: 5
        run: |
          dist/Anonimlestirici.app/Contents/MacOS/Anonimlestirici --selftest | tee selftest.log
          grep -q "SONUÇ: BAŞARILI" selftest.log
      - name: Sürüme ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,ner,windows]"
      - name: Dil modeli (önbellekten)
        uses: actions/cache@v4
        with:
          path: anonimlestirici/models/ner
          key: ner-modernbert-tr-pii-69b2563-full
      - run: ./packaging/fetch_model.sh
        shell: bash
        if: hashFiles('anonimlestirici/models/ner/model.onnx') == ''
      - run: pytest -q
      - name: Uygulama paketi
        run: |
          python packaging/collect_licenses.py build/licenses
          python -m PyInstaller --noconfirm --clean --log-level WARN packaging/windows/anonimlestirici-win.spec --distpath dist/windows --workpath build/windows
      - name: Paketlenmiş uygulamanın öz-testi
        shell: pwsh
        timeout-minutes: 5
        run: |
          $p = Start-Process -FilePath "dist\windows\Anonimlestirici\Anonimlestirici.exe" -ArgumentList "--selftest","--log","$PWD\selftest.log" -Wait -PassThru
          Get-Content selftest.log -Encoding utf8
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Kurulum sihirbazı
        shell: pwsh
        run: |
          $v = python -c "import anonimlestirici; print(anonimlestirici.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$v" packaging\windows\installer.iss
          Get-Item dist\Anonimlestirici-Kurulum.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Anonimlestirici-windows
          path: dist/Anonimlestirici-Kurulum.exe
      - name: Sürüme ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Anonimlestirici-Kurulum.exe
